<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Supabase Todo List</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; background-color: #f4f4f9; padding: 40px; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { margin-top: 0; color: #333; }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex-grow: 1; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        button { cursor: pointer; padding: 8px 16px; background: #3ecf8e; color: white; border: none; border-radius: 4px; font-weight: bold; }
        ul { list-style: none; padding: 0; }
        li { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; }
        .todo-text { cursor: pointer; flex-grow: 1; }
        .completed { text-decoration: line-through; color: #888; }
        .del-btn { background: #ff4d4d; font-size: 12px; padding: 4px 8px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Project Tasks</h2>
    <div class="input-group">
        <input type="text" id="taskInput" placeholder="What needs to be done?">
        <button onclick="addTodo()">Add</button>
    </div>
    <ul id="todoList"></ul>
</div>

<script>
    // API CONNECTIONS
    // Replace 'YOUR_SUPABASE_URL' with your actual Project URL from Settings > API
    const SUPABASE_URL = 'https://your-project-id.supabase.co'; 
    const SUPABASE_ANON_KEY = 'sb_publishable_vUVufrhbdIVIToomJ02D0g_sRXTzpO-';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Load initial data
    fetchTodos();

    async function fetchTodos() {
        const { data, error } = await supabaseClient
            .from('todos')
            .select('*')
            .order('id', { ascending: true });

        if (error) {
            console.error('Error fetching:', error.message);
            return;
        }

        const listElement = document.getElementById('todoList');
        listElement.innerHTML = '';
        data.forEach(todo => {
            const li = document.createElement('li');
            li.innerHTML = `
                <span class="todo-text ${todo.is_completed ? 'completed' : ''}" 
                      onclick="toggleTodo(${todo.id}, ${todo.is_completed})">
                    ${todo.task}
                </span>
                <button class="del-btn" onclick="deleteTodo(${todo.id})">Delete</button>
            `;
            listElement.appendChild(li);
        });
    }

    async function addTodo() {
        const input = document.getElementById('taskInput');
        const task = input.value;
        if (!task) return;

        const { error } = await supabaseClient
            .from('todos')
            .insert([{ task: task }]);

        if (error) console.error('Error adding:', error.message);
        input.value = '';
        fetchTodos();
    }

    async function toggleTodo(id, currentStatus) {
        const { error } = await supabaseClient
            .from('todos')
            .update({ is_completed: !currentStatus })
            .eq('id', id);

        if (error) console.error('Error updating:', error.message);
        fetchTodos();
    }

    async function deleteTodo(id) {
        const { error } = await supabaseClient
            .from('todos')
            .delete()
            .eq('id', id);

        if (error) console.error('Error deleting:', error.message);
        fetchTodos();
    }
</script>

</body>
</html>
